name: Feature request
description: Propose a new feature or improvement
labels: ["feature", "triage"]
projects: ["jumperck/7"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
      description: What need or frustration drives this request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable conditions that mean this feature is done.
      placeholder: |
        - [ ] ...
        - [ ] Tests cover the new behavior
        - [ ] Docs updated where needed
    validations:
      required: true
  - type: input
    id: adr
    attributes:
      label: Related ADR or Discussion
      description: Link if this implements or changes a recorded decision.
    validations:
      required: false
