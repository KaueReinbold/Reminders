# Claude Code reviews pull requests and posts findings as comments.
# It never approves, requests changes, or merges: humans decide (ADR-0008).
# Auth: CLAUDE_CODE_OAUTH_TOKEN repo secret from `claude setup-token` (maintainer subscription).
# Runs automatically only for PRs opened by the repository owner; for anyone else the
# owner opts in by adding the `claude-review` label. Drafts and forks are skipped.
# The review starts only after every other workflow run on the PR head has finished green.
name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  wait-for-checks:
    name: Wait for other checks
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.action != 'labeled' && github.event.pull_request.user.login == github.repository_owner) ||
        (github.event.action == 'labeled' && github.event.label.name == 'claude-review')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    outputs:
      all-green: ${{ steps.poll.outputs.all-green }}
    steps:
      - name: Poll workflow runs until every other workflow completes
        id: poll
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          SELF: ${{ github.workflow }}
        run: |
          # Workflow runs exist from trigger time, unlike check runs which register
          # only when a job starts, so no run can slip past the first poll. The short
          # delay is a margin for API propagation across sibling runs of the same push.
          sleep 10
          while true; do
            runs=$(gh api --paginate "repos/$REPO/actions/runs?head_sha=$SHA&per_page=100" \
              --jq '.workflow_runs[] | select(.name != env.SELF) | "\(.status) \(.conclusion // "-") \(.name)"')
            echo "$runs"
            if ! echo "$runs" | grep -Eq '^(queued|in_progress|waiting|pending|requested) '; then
              break
            fi
            sleep 20
          done
          if echo "$runs" | grep -Eq '^completed (failure|cancelled|timed_out|action_required|startup_failure|stale) '; then
            echo "Some workflows are not green; skipping the review."
            echo "all-green=false" >> "$GITHUB_OUTPUT"
          else
            echo "all-green=true" >> "$GITHUB_OUTPUT"
          fi

  review:
    name: Review pull request
    needs: wait-for-checks
    if: needs.wait-for-checks.outputs.all-green == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Review with Claude Code
        uses: anthropics/claude-code-action@dcb57747bfceeaa1fa72638cae52295d1d853d4a # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the review agent for this repository. The PR branch is checked out
            in the working directory. Read CLAUDE.md and agents.md first: they define the
            standards you review against. Then read .claude/skills/caveman/SKILL.md and
            .claude/skills/ponytail/SKILL.md and apply both: caveman (full) for the wording
            of every comment, ponytail as a review lens (unneeded code, new dependency where
            stdlib works, single-caller abstraction, mixed changes are findings).

            Review the diff for:
            - Correctness: bugs, unhandled errors, broken contracts between the .NET, Go
              and C++ APIs, React, MVC and Flutter clients.
            - Security: secrets in code or compose files, injection, XSS, unsafe defaults.
            - Repo rules: conventional PR title, no em or en dashes anywhere, minimal
              change (no new dependencies without need), migrations for both Postgres and
              SqlServer on schema changes, Cypress specs updated for React UI or API
              contract changes, ADR present for architecture or tooling decisions, no AI
              attribution in commits or PR body.
            - Tests: new behaviour covered, existing suites still meaningful.

            Before reviewing, run `gh pr view --comments` and read earlier review
            summaries on this PR. Do not repeat a finding that was already raised, and
            check whether earlier findings were addressed. Do one complete pass over the
            whole checklist above; do not drip findings across runs.

            Reporting rules:
            - Post findings only as GitHub comments. Tag each with a severity prefix:
              [blocker] (must fix before merge), [major] (likely bug or rule violation),
              [minor] (worth fixing, not blocking), [nit] (style or taste).
            - Inline comments (mcp__github_inline_comment__create_inline_comment with
              confirmed: true) only for [blocker] and [major]. Put [minor] and [nit]
              findings in the summary only, at most five of them.
            - Post exactly one summary comment with `gh pr comment`, grouped by severity.
              If no [blocker] or [major] remains, end the summary with the line
              "Ready for human review." If there are no findings at all, say so.
            - Report outcomes, not process. Never list the categories or rules that
              came back clean, and never cite a repository document as the reason a
              finding stands: state the defect on its own terms. A review with no
              findings is one line saying so plus the readiness line, nothing more.
            - Caveman wording: one line per finding, `file:line: problem. fix.`, no
              throat-clearing, no restating the diff. Full sentences only for security
              findings or design disagreements that need the why.
            - Never approve, request changes, or merge. Never push commits. Never comment
              on style that a linter already enforces.
          claude_args: |
            --max-turns 50
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
