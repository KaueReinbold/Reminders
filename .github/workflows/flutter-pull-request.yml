# Triggers on PR when Flutter app code changes
# Runs static analysis and widget tests
name: Build and Test Flutter App

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/app/flutter/reminders_app/**'
      - '!src/app/flutter/reminders_app/**/*.md'

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: src/app/flutter/reminders_app

      - name: Analyze
        run: flutter analyze
        working-directory: src/app/flutter/reminders_app

      - name: Run widget tests
        run: flutter test
        working-directory: src/app/flutter/reminders_app
