# Triggers on PR when Go API code changes
# Builds, runs unit tests and enforces a minimum coverage (#303)
name: go - build - pull request

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/server/api/go/reminders-api/**'
      - '!src/server/api/go/reminders-api/**/*.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repo
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'

    - name: Install dependencies
      working-directory: src/server/api/go/reminders-api
      run: |
        go env
        go mod download

    - name: Build
      working-directory: src/server/api/go/reminders-api
      run: go build -v ./cmd/app/

    - name: Test with coverage
      working-directory: src/server/api/go/reminders-api
      run: go test ./... -coverpkg=./... -coverprofile=coverage.out

    - name: Enforce coverage threshold
      working-directory: src/server/api/go/reminders-api
      env:
        MIN_COVERAGE: 70
      run: |
        total=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | tr -d '%')
        echo "total coverage: ${total}% (minimum ${MIN_COVERAGE}%)"
        if [ -z "$total" ] || awk -v t="$total" -v m="$MIN_COVERAGE" 'BEGIN { exit !(t < m) }'; then
          echo "Coverage below threshold"
          exit 1
        fi
