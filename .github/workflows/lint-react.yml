# ESLint for the React app (build and tests live in react-pull-request.yml)
name: Lint React

on:
  push:
    branches:
      - main
    paths:
      - 'src/app/reactjs/reminders-app/**'
      - '!src/app/reactjs/reminders-app/**/*.md'
  pull_request:
    branches:
      - main
    paths:
      - 'src/app/reactjs/reminders-app/**'
      - '!src/app/reactjs/reminders-app/**/*.md'

permissions:
  contents: read

jobs:
  lint-react:
    name: Lint React app (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/app/reactjs/reminders-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/app/reactjs/reminders-app

      - name: Run ESLint
        run: npm run lint
        working-directory: src/app/reactjs/reminders-app
