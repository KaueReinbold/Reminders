name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Validate conventional commit title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            test
            docs
            ci
            chore
            perf
            build
          scopes: |
            api
            go
            cpp
            react
            mvc
            flutter
            blockchain
            migrations
            infra
            ci
            deps
            deps-dev
          requireScope: false
